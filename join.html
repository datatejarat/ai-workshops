<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کارگاه AI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>پیوستن به کارگاه · گروه اول</title>
<script>
(function(){try{var t=localStorage.getItem('ai_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root[data-theme="dark"]{--bg:#080c17;--sur:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#f1f5f9;--txt2:#c9d4e2;--mut:#8b96a8;--amber:#fbbf24;--orange:#f97316;--mint:#34d399;--rose:#fb7185;--amber-soft:rgba(251,191,36,.14);--mint-soft:rgba(52,211,153,.14);--rose-soft:rgba(251,113,133,.14)}
:root[data-theme="light"]{--bg:#fdfcfa;--sur:rgba(15,23,42,.04);--line:rgba(15,23,42,.12);--txt:#0f172a;--txt2:#1e293b;--mut:#64748b;--amber:#b45309;--orange:#c2410c;--mint:#059669;--rose:#e11d48;--amber-soft:rgba(180,83,9,.12);--mint-soft:rgba(5,150,105,.12);--rose-soft:rgba(225,29,72,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
button,input{touch-action:manipulation;font-family:inherit}
input{font-size:16px}
button{position:relative;overflow:hidden}
.conn-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-70px);background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;padding:10px 22px;border-radius:12px;font-size:.82rem;font-weight:700;z-index:9999;box-shadow:0 8px 24px rgba(220,38,38,.5);opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.conn-banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wrap{max-width:440px;margin:0 auto}
.card{background:linear-gradient(160deg,var(--sur),rgba(255,255,255,.005));border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;backdrop-filter:blur(20px);box-shadow:0 24px 60px rgba(0,0,0,.4);margin-bottom:14px}
.badge{display:inline-block;padding:.3rem .8rem;border-radius:999px;background:var(--amber-soft);color:var(--amber);border:1px solid rgba(251,191,36,.35);font-size:.72rem;font-weight:700}
h1{font-size:1.15rem;margin:.85rem 0 .3rem}
h2{font-size:1.05rem;margin:.6rem 0 .5rem;line-height:1.5}
p{font-size:.85rem;color:var(--mut);line-height:1.8;margin:0}
label{display:block;font-size:.8rem;color:var(--txt);margin:1rem 0 .4rem;font-weight:600}
input{width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--txt)}
input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.btn{width:100%;margin-top:1rem;padding:.9rem;border-radius:12px;border:none;background:linear-gradient(135deg,#fde68a,var(--amber) 45%,var(--orange));color:#1a1206;font-weight:700;font-size:.95rem;cursor:pointer;box-shadow:0 8px 24px rgba(251,191,36,.3);transition:.2s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sec{background:var(--sur);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.score{margin-top:.8rem;padding:.7rem;border-radius:12px;background:var(--mint-soft);border:1px solid rgba(52,211,153,.3);text-align:center;color:var(--mint);font-weight:700;font-size:.92rem}
.status{margin-top:.6rem;font-size:.78rem;color:var(--mut);text-align:center}
.theme-btn{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:var(--sur);border:1px solid var(--line);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--amber);font-size:1.2rem}
.opt-grid{display:grid;gap:.55rem;margin-top:.8rem}
.opt-grid.g2{grid-template-columns:repeat(2,1fr)}
.opt-grid.g1{grid-template-columns:1fr}
.opt{padding:.9rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--sur);color:var(--txt2);cursor:pointer;font-size:.9rem;text-align:start;display:flex;justify-content:space-between;align-items:center;gap:.5rem;width:100%;transition:.2s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.1)}
.opt.voted{background:var(--amber-soft);border-color:rgba(251,191,36,.6);color:var(--txt);font-weight:600}
.opt:disabled{cursor:default;opacity:.85}
.quiz-item{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--line)}
.quiz-item:first-child{margin-top:0;padding-top:0;border-top:none}
.quiz-q{font-weight:600;color:var(--txt);font-size:.9rem;margin-bottom:.5rem;line-height:1.6}
.waiting{text-align:center;padding:2rem 1rem;color:var(--mut);font-size:.88rem;line-height:1.9}
#widgetArea:empty::before{content:'منتظر شروع تعامل بعدی توسط مدرس…';display:block;text-align:center;padding:2rem 1rem;color:var(--mut);font-size:.85rem}
.wc-row{display:flex;gap:.5rem;margin-top:1rem}
.wc-row input{flex:1;margin:0}
.wc-row .btn{width:auto;margin:0;padding:.85rem 1.2rem}
.progress-wrap{margin-top:.8rem;display:flex;flex-direction:column;gap:.35rem}
.progress-bar{height:6px;background:var(--sur);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--amber));border-radius:999px;transition:width .4s ease;box-shadow:0 0 8px var(--mint)}
.progress-text{font-size:.73rem;color:var(--mut);text-align:center}
</style>
</head>
<body>

<div class="conn-banner" id="connBanner">⚠ اتصال به سرور قطع است — تلاش مجدد...</div>

<div class="wrap">
  <div class="card" id="aliasCard">
    <button class="theme-btn" id="themeBtn" aria-label="تغییر تم">☾</button>
    <span class="badge">G1-1405-05-05 · گروه اول</span>
    <h1>به کارگاه خوش آمدید</h1>
    <p>یک نام مستعار انتخاب کنید. این نام در لیدربرد نمایش داده می‌شود.</p>
    <label for="alias">نام مستعار</label>
    <input id="alias" placeholder="مثلاً کارشناس اعتبارات" maxlength="30" autocomplete="off">
    <button class="btn" id="saveBtn">ثبت و ورود</button>
    <div class="score" id="scoreBox" style="display:none"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="card" id="liveCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="badge">ایستگاه تعاملی</span>
      <span id="myAlias" style="font-size:.78rem;color:var(--mut)"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">شما در ۰ از ۱۴ ایستگاه شرکت کرده‌اید</div>
    </div>
    <h2 id="widgetQ" style="margin-top:.8rem"></h2>
    <div id="widgetArea"></div>
    <div class="score" id="myScore" style="display:none"></div>
  </div>
</div>

<script type="module">
import * as SB from './assets/js/supabase-client.js';

const toFa = function(n){ return String(n).replace(/\d/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
const esc = function(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
};
const safeLS = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const LSKey = 'ai_' + SB.SESSION_CODE + '_';
const SUPABASE_CHECK_URL = 'https://aqmcervucsyyqlbifmqh.supabase.co/rest/v1/sessions?select=code&limit=1';
const SUPABASE_KEY = 'sb_publishable_TMwkKkKQ5MwhuqVZSKgFcg_2YfGk-Pk';
const TOTAL_STATIONS = 14;

const $ = function(id){ return document.getElementById(id); };
const aliasInput = $('alias');
const saveBtn = $('saveBtn');
const scoreBox = $('scoreBox');
const statusEl = $('status');
const aliasCard = $('aliasCard');
const liveCard = $('liveCard');
const widgetQ = $('widgetQ');
const widgetArea = $('widgetArea');
const myAlias = $('myAlias');
const myScore = $('myScore');
const progressFill = $('progressFill');
const progressText = $('progressText');

let myVotes = [];
let currentWidgetId = null;
let pollTimer = null;

/* ========== Connection banner ========== */
let connFailCount = 0;
let connStatus = 'online';
function setConnStatus(status){
  if (connStatus === status) return;
  connStatus = status;
  const banner = $('connBanner');
  if (!banner) return;
  if (status === 'online') banner.classList.remove('show');
  else banner.classList.add('show');
}
window.addEventListener('offline', function(){ connFailCount = 2; setConnStatus('offline'); });
window.addEventListener('online', function(){ connFailCount = 0; setConnStatus('online'); });
async function checkConnection(){
  try {
    const res = await fetch(SUPABASE_CHECK_URL, {
      method: 'GET',
      cache: 'no-store',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (res.ok) {
      connFailCount = 0;
      setConnStatus('online');
    } else {
      connFailCount++;
      if (connFailCount >= 2) setConnStatus('error');
    }
  } catch(e) {
    connFailCount++;
    if (connFailCount >= 2) setConnStatus('offline');
  }
}
setInterval(checkConnection, 15000);
setTimeout(checkConnection, 2000);

/* ========== Theme ========== */
$('themeBtn').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  safeLS.set('ai_theme', next);
  $('themeBtn').textContent = next === 'dark' ? '☾' : '☀';
});
$('themeBtn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☀';

aliasInput.value = safeLS.get(LSKey + 'alias') || '';

/* ========== Retry helper ========== */
function isNonRetryable(e){
  if (!e) return false;
  var code = e.code || '';
  var msg = String(e.message || '');
  if (code === '23505') return true;
  if (msg.indexOf('rate_limit_exceeded') > -1) return true;
  if (msg.indexOf('invalid_participant') > -1) return true;
  if (msg.indexOf('missing_parameters') > -1) return true;
  return false;
}
async function retryAsync(fn, attempts){
  attempts = attempts || 3;
  var lastErr;
  for (var i = 0; i < attempts; i++) {
    try {
      return await fn();
    } catch(e) {
      lastErr = e;
      if (isNonRetryable(e)) throw e;
      if (i < attempts - 1) {
        await new Promise(function(r){ setTimeout(r, 1000 * (i + 1)); });
      }
    }
  }
  throw lastErr;
}

/* ========== Register ========== */
saveBtn.addEventListener('click', async function(){
  var v = aliasInput.value.trim();
  if (!v) { aliasInput.focus(); return; }
  saveBtn.disabled = true;
  saveBtn.textContent = 'در حال ثبت…';
  try {
    await retryAsync(function(){ return SB.registerParticipant(v); });
    safeLS.set(LSKey + 'alias', v);
    await refreshScore();
    aliasCard.style.display = 'none';
    liveCard.style.display = 'block';
    await refreshCurrentWidget();
    startPolling();
  } catch(e) {
    console.error('register failed:', e);
    statusEl.textContent = '⚠ ' + (e.message || String(e));
    statusEl.style.color = 'var(--rose)';
    saveBtn.disabled = false;
    saveBtn.textContent = 'تلاش دوباره';
  }
});

async function refreshScore(){
  try {
    var p = await SB.getMyParticipant();
    if (!p) return;
    scoreBox.style.display = 'block';
    scoreBox.textContent = 'امتیاز شما: ' + p.score;
    myScore.style.display = 'block';
    myScore.textContent = 'امتیاز شما: ' + p.score;
    myAlias.textContent = p.alias;
  } catch(e){}
}

async function refreshMyVotes(){
  try { myVotes = await SB.getMyVotes(); } catch(e){ myVotes = []; }
}

function updateProgress(){
  var wids = {};
  myVotes.forEach(function(v){ wids[v.widget_id] = true; });
  var done = Object.keys(wids).length;
  if (progressFill) progressFill.style.width = (done / TOTAL_STATIONS * 100) + '%';
  if (progressText) progressText.textContent = 'شما در ' + toFa(done) + ' از ' + toFa(TOTAL_STATIONS) + ' ایستگاه شرکت کرده‌اید';
}

async function refreshCurrentWidget(){
  try {
    var ps = await SB.getPresenterState();
    var wid = SB.sectionToWidget(ps && ps.current_section);
    if (wid === currentWidgetId) {
      await refreshMyVotes();
      updateProgress();
      return;
    }
    currentWidgetId = wid;
    await renderWidget(wid);
    await refreshScore();
  } catch(e){ console.warn('refreshCurrentWidget', e); }
}

function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(async function(){
    await refreshCurrentWidget();
    await refreshScore();
  }, 3000);
}

/* ========== RPC helpers ========== */
async function rpcOrEdit(wid, values, pts){
  pts = pts || 5;
  var pid = SB.getPid ? SB.getPid() : safeLS.get(LSKey + 'pid');
  if (!pid) throw new Error('شناسه کاربر پیدا نشد — دوباره وارد شوید');
  var res = await SB.supabase.rpc('submit_or_edit_votes', {
    p_pid: pid, p_session: SB.SESSION_CODE, p_widget: wid,
    p_values: values, p_points_if_new: pts
  });
  if (res.error) throw res.error;
  return res.data;
}

async function rpcStatement(wid, statement, value, isCorrect, pts){
  var pid = SB.getPid ? SB.getPid() : safeLS.get(LSKey + 'pid');
  if (!pid) throw new Error('شناسه کاربر پیدا نشد');
  var res = await SB.supabase.rpc('submit_statement_vote', {
    p_pid: pid, p_session: SB.SESSION_CODE, p_widget: wid,
    p_statement: statement, p_value: value,
    p_is_correct: isCorrect, p_points: pts
  });
  if (res.error) throw res.error;
  return res.data;
}

/* ========== Dispatcher ========== */
async function renderWidget(wid){
  widgetArea.innerHTML = '';
  if (!wid) {
    widgetQ.textContent = '';
    await refreshMyVotes();
    updateProgress();
    return;
  }
  var meta = SB.WIDGET_META[wid];
  if (!meta) {
    widgetQ.textContent = '';
    await refreshMyVotes();
    updateProgress();
    return;
  }
  widgetQ.textContent = meta.q;
  await refreshMyVotes();
  updateProgress();
  var values = myVotes.filter(function(v){ return v.widget_id === wid; }).map(function(v){ return v.vote_value; });

  if (meta.type === 'wordcloud') renderWC(wid, values[0] || '');
  else if (meta.type === 'single' || meta.type === 'quiz2') renderSingle(wid, meta, values);
  else if (meta.type === 'multi') renderMulti(wid, meta, values);
  else if (meta.type === 'quiz') renderQuiz(wid, meta);
  else if (meta.type === 'bestprompt') renderPrompt(wid, meta, values);
}

/* ========== Word cloud ========== */
function renderWC(wid, current){
  if (current) {
    widgetArea.innerHTML = '<div class="waiting">✓ کلمه شما: <strong style="color:var(--amber)">' + esc(current) + '</strong></div>';
    var eb = document.createElement('button');
    eb.className = 'btn btn-sec';
    eb.textContent = '✎ ویرایش';
    eb.onclick = function(){ renderWC(wid, ''); };
    widgetArea.appendChild(eb);
    return;
  }
  var row = document.createElement('div');
  row.className = 'wc-row';
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'یک کلمه…';
  inp.maxLength = 20;
  var b = document.createElement('button');
  b.className = 'btn';
  b.textContent = 'ثبت';
  b.disabled = true;
  inp.oninput = function(){ b.disabled = !inp.value.trim(); };
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (!b.disabled) b.click();
    }
  });
  b.onclick = async function(){
    var w = inp.value.trim();
    if (!w) return;
    b.disabled = true;
    b.textContent = '…';
    try {
      await retryAsync(function(){ return rpcOrEdit(wid, [w], 5); });
      await refreshScore();
      await refreshMyVotes();
      renderWidget(wid);
    } catch(e) {
      console.error(e);
      b.textContent = 'خطا — دوباره';
      setTimeout(function(){ b.disabled = false; b.textContent = 'ثبت'; }, 1500);
    }
  };
  row.appendChild(inp);
  row.appendChild(b);
  widgetArea.appendChild(row);
  setTimeout(function(){ inp.focus(); }, 100);
}

/* ========== Single choice ========== */
function renderSingle(wid, meta, values){
  var editing = values.length === 0;
  var selected = values[0] || null;

  function draw(){
    widgetArea.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'opt-grid ' + (meta.options.length <= 2 ? 'g2' : 'g1');
    meta.options.forEach(function(o){
      var btn = document.createElement('button');
      btn.className = 'opt';
      if (selected === o.k) btn.classList.add('voted');
      btn.innerHTML = '<span>' + esc(o.l) + '</span>' + (selected === o.k ? '<span style="font-weight:800">✓</span>' : '');
      if (!editing) btn.disabled = true;
      else btn.onclick = function(){ selected = o.k; draw(); };
      grid.appendChild(btn);
    });
    widgetArea.appendChild(grid);
    var ab = document.createElement('button');
    ab.className = 'btn';
    if (editing) {
      ab.textContent = selected ? 'ثبت' : 'یک گزینه انتخاب کنید';
      ab.disabled = !selected;
      ab.onclick = async function(){
        ab.disabled = true;
        ab.textContent = '…';
        try {
          await retryAsync(function(){ return rpcOrEdit(wid, [selected], 5); });
          await refreshScore();
          await refreshMyVotes();
          editing = false;
          draw();
        } catch(e) {
          ab.textContent = 'خطا — دوباره';
          setTimeout(draw, 1500);
        }
      };
    } else {
      ab.textContent = '✎ ویرایش انتخاب';
      ab.className = 'btn btn-sec';
      ab.onclick = function(){ editing = true; draw(); };
    }
    widgetArea.appendChild(ab);
  }
  draw();
}

/* ========== Multi choice ========== */
function renderMulti(wid, meta, values){
  var editing = values.length === 0;
  var selected = {};
  values.forEach(function(k){ selected[k] = true; });

  function draw(){
    widgetArea.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'opt-grid g2';
    meta.options.forEach(function(o){
      var btn = document.createElement('button');
      btn.className = 'opt';
      if (selected[o.k]) btn.classList.add('voted');
      btn.innerHTML = '<span>' + esc(o.l) + '</span>' + (selected[o.k] ? '<span style="font-weight:800">✓</span>' : '');
      if (!editing) btn.disabled = true;
      else btn.onclick = function(){
        if (selected[o.k]) delete selected[o.k];
        else selected[o.k] = true;
        draw();
      };
      grid.appendChild(btn);
    });
    widgetArea.appendChild(grid);
    var count = Object.keys(selected).length;
    var ab = document.createElement('button');
    ab.className = 'btn';
    if (editing) {
      ab.textContent = count > 0 ? 'ثبت (' + toFa(count) + ')' : 'حداقل یک مورد';
      ab.disabled = count === 0;
      ab.onclick = async function(){
        ab.disabled = true;
        ab.textContent = '…';
        try {
          await retryAsync(function(){ return rpcOrEdit(wid, Object.keys(selected), 5); });
          await refreshScore();
          await refreshMyVotes();
          editing = false;
          draw();
        } catch(e) {
          ab.textContent = 'خطا — دوباره';
          setTimeout(draw, 1500);
        }
      };
    } else {
      ab.textContent = '✎ ویرایش انتخاب';
      ab.className = 'btn btn-sec';
      ab.onclick = function(){ editing = true; draw(); };
    }
    widgetArea.appendChild(ab);
  }
  draw();
}

/* ========== Quiz ========== */
function renderQuiz(wid, meta){
  meta.statements.forEach(function(st){
    var wrap = document.createElement('div');
    wrap.className = 'quiz-item';
    wrap.innerHTML = '<div class="quiz-q">' + esc(st.text) + '</div>';

    var votedVal = null;
    for (var i = 0; i < myVotes.length; i++) {
      if (myVotes[i].widget_id === wid && myVotes[i].statement_id === st.id) {
        votedVal = myVotes[i].vote_value;
        break;
      }
    }
    var tempSelected = votedVal || null;
    var locked = !!votedVal;

    var grid = document.createElement('div');
    grid.className = 'opt-grid g2';

    var submitBtn = document.createElement('button');
    submitBtn.className = 'btn';
    submitBtn.style.cssText = 'margin-top:.6rem;font-size:.85rem;padding:.7rem';

    var editBtn = document.createElement('button');
    editBtn.className = 'btn btn-sec';
    editBtn.style.cssText = 'margin-top:.5rem;font-size:.82rem;padding:.65rem;display:none';
    editBtn.textContent = '✎ ویرایش پاسخ';

    var errEl = document.createElement('div');
    errEl.style.cssText = 'display:none;margin-top:.5rem;padding:.6rem;background:var(--rose-soft);border:1px solid rgba(251,113,133,.4);border-radius:8px;color:var(--rose);font-size:.75rem;line-height:1.6;word-break:break-word';

    function draw(){
      grid.innerHTML = '';
      var opts = [['t','واقعیت'],['f','افسانه'],['u','مطمئن نیستم']];
      opts.forEach(function(pair){
        var k = pair[0];
        var l = pair[1];
        var btn = document.createElement('button');
        btn.className = 'opt';
        if (tempSelected === k) btn.classList.add('voted');
        btn.innerHTML = '<span>' + l + '</span>' + (tempSelected === k ? '<span style="font-weight:800">✓</span>' : '');
        if (locked) btn.disabled = true;
        else btn.onclick = function(){ tempSelected = k; draw(); };
        grid.appendChild(btn);
      });

      if (locked) {
        var label = votedVal === 't' ? 'واقعیت' : votedVal === 'f' ? 'افسانه' : 'مطمئن نیستم';
        submitBtn.textContent = '✓ ثبت شد: ' + label;
        submitBtn.disabled = true;
        submitBtn.style.opacity = '.65';
        editBtn.style.display = 'block';
      } else {
        submitBtn.textContent = tempSelected ? 'ثبت پاسخ' : 'یک گزینه انتخاب کنید';
        submitBtn.disabled = !tempSelected;
        submitBtn.style.opacity = '1';
        editBtn.style.display = 'none';
      }
      errEl.style.display = 'none';
    }

    editBtn.onclick = function(){
      locked = false;
      tempSelected = votedVal;
      draw();
    };

    submitBtn.onclick = async function(){
      if (locked || !tempSelected) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ثبت…';
      errEl.style.display = 'none';
      var isCorrect = (tempSelected === 't' && st.correct) || (tempSelected === 'f' && !st.correct);
      try {
        await retryAsync(function(){
          return rpcStatement(wid, st.id, tempSelected, isCorrect, isCorrect ? 15 : 3);
        });
        await refreshScore();
        await refreshMyVotes();
        renderWidget(wid);
      } catch(e) {
        console.error('quiz submit failed:', e);
        submitBtn.disabled = false;
        submitBtn.textContent = 'دوباره تلاش کنید';
        errEl.textContent = '⚠ ' + (e.message || e.code || e.toString());
        errEl.style.display = 'block';
      }
    };

    draw();
    wrap.appendChild(grid);
    wrap.appendChild(submitBtn);
    wrap.appendChild(editBtn);
    wrap.appendChild(errEl);
    widgetArea.appendChild(wrap);
  });
}

/* ========== Best prompt ========== */
function renderPrompt(wid, meta, values){
  var editing = values.length === 0;
  var selected = values[0] || null;

  function draw(){
    widgetArea.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'opt-grid g1';
    meta.prompts.forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'opt';
      if (selected === p.tag) btn.classList.add('voted');
      btn.style.cssText = 'flex-direction:column;align-items:flex-start;text-align:right';
      btn.innerHTML = '<div style="font-weight:700;color:var(--amber);font-size:.78rem">گزینه ' + p.tag + '</div><div style="font-size:.83rem;line-height:1.7;margin-top:.3rem">' + esc(p.text) + '</div>';
      if (!editing) btn.disabled = true;
      else btn.onclick = function(){ selected = p.tag; draw(); };
      grid.appendChild(btn);
    });
    widgetArea.appendChild(grid);
    var ab = document.createElement('button');
    ab.className = 'btn';
    if (editing) {
      ab.textContent = selected ? 'ثبت' : 'یک گزینه انتخاب کنید';
      ab.disabled = !selected;
      ab.onclick = async function(){
        ab.disabled = true;
        ab.textContent = '…';
        try {
          await retryAsync(function(){ return rpcOrEdit(wid, [selected], 5); });
          await refreshScore();
          await refreshMyVotes();
          editing = false;
          draw();
        } catch(e) {
          ab.textContent = 'خطا — دوباره';
          setTimeout(draw, 1500);
        }
      };
    } else {
      ab.textContent = '✎ ویرایش انتخاب';
      ab.className = 'btn btn-sec';
      ab.onclick = function(){ editing = true; draw(); };
    }
    widgetArea.appendChild(ab);
  }
  draw();
}

/* ========== Boot ========== */
(async function(){
  var savedName = safeLS.get(LSKey + 'alias');
  if (!savedName) return;
  try {
    var p = await SB.getMyParticipant();
    if (p) {
      aliasCard.style.display = 'none';
      liveCard.style.display = 'block';
      await refreshScore();
      await refreshCurrentWidget();
      startPolling();
    }
  } catch(e) { console.warn('auto-login failed', e); }
})();

aliasInput.addEventListener('focus', function(){
  setTimeout(function(){ window.scrollTo(0, 0); }, 120);
});
</script>
